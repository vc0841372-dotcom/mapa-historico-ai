
name: Generar video

on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema del video"
        required: true
        type: string

jobs:
  crear-video:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar video
        run: python main.py "${{ inputs.tema }}"

      - name: Guardar MP4
        uses: actions/upload-artifact@v4
        with:
          name: video-generado
          path: video_generado.mp4
          
